<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F2FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4FACFE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF0844;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB199;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Pill -->
  <rect x="10" y="10" width="580" height="160" rx="24" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
  
  <!-- Orion Constellation Icon Symbol -->
  <g transform="translate(40, 30)">
    <!-- Star lines -->
    <path d="M20,20 L60,35 L100,25 L65,70 L55,100 L20,20" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,3" opacity="0.6" />
    <path d="M60,35 L65,70 M100,25 L65,70" stroke="#38BDF8" stroke-width="2" opacity="0.6" />
    
    <!-- Orion Belt Stars -->
    <circle cx="50" cy="58" r="4" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="65" cy="65" r="5" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="80" cy="72" r="4" fill="#FFFFFF" filter="url(#glow)" />
    
    <!-- Outer Stars -->
    <circle cx="20" cy="20" r="6" fill="url(#accent)" filter="url(#glow)" />
    <circle cx="100" cy="25" r="5" fill="#00F2FE" filter="url(#glow)" />
    <circle cx="55" cy="100" r="6" fill="#00F2FE" filter="url(#glow)" />
    
    <!-- Target Reticle Box -->
    <rect x="35" y="40" width="60" height="55" rx="6" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8" />
  </g>
  
  <!-- Typography -->
  <text x="180" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="2" fill="url(#grad1)">
    ORION<tspan fill="#F8FAFC">-LITE</tspan>
  </text>
  
  <text x="182" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5" fill="#94A3B8">
    EDGE-ORIENTED PERSON RE-IDENTIFICATION
  </text>
  
  <!-- Tech Badges inside Logo -->
  <rect x="182" y="128" width="105" height="20" rx="4" fill="#1E293B" />
  <text x="190" y="142" font-family="monospace" font-size="11" font-weight="600" fill="#38BDF8">MobileNetV4</text>
  
  <rect x="295" y="128" width="95" height="20" rx="4" fill="#1E293B" />
  <text x="303" y="142" font-family="monospace" font-size="11" font-weight="600" fill="#A855F7">Circle Loss</text>
  
  <rect x="398" y="128" width="75" height="20" rx="4" fill="#1E293B" />
  <text x="406" y="142" font-family="monospace" font-size="11" font-weight="600" fill="#22C55E">CoreML</text>
</svg>